<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxOkOSikYgSyOqiMwwoHfbeHjkcsNDwM_krwqnDh-Pugk2ky3k8QzP0wh7zhT59OB7-uw/exec';

let tableData = [];

function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.innerHTML=msg;
  t.className=`toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'),3000);
}

function statusChip(s){
  if(s==='พร้อมใช้งาน') return `<span class="chip chip-green">✅ ${s}</span>`;
  if(s==='ขาดเมล์+WiFi') return `<span class="chip chip-red">⚠️ ${s}</span>`;
  if(s==='ซ่อม') return `<span class="chip chip-orange">🔧 ${s}</span>`;
  return `<span class="chip chip-blue">${s}</span>`;
}

function renderTable(){
  const body=document.getElementById('tableBody');

  if(tableData.length===0){
    body.innerHTML=`
    <tr>
      <td colspan="10">
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <p>ไม่มีข้อมูล</p>
        </div>
      </td>
    </tr>`;
    return;
  }

  body.innerHTML=tableData.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${r.date||'-'}</td>
      <td>${r.name||'-'}</td>
      <td>${r.machine||'-'}</td>
      <td>${r.dept||'-'}</td>
      <td>${r.type||'-'}</td>
      <td>${statusChip(r.status||'-')}</td>
      <td>${r.cabinet||'-'}</td>
      <td>${r.operator||'-'}</td>
      <td style="text-align:center">
        <button class="btn-del" onclick="deleteRow(${i})">🗑️</button>
      </td>
    </tr>
  `).join('');

  updateStats();
}

function updateStats(){
  document.getElementById('stat-total').textContent=tableData.length;
  document.getElementById('stat-ready').textContent=
    tableData.filter(r=>r.status==='พร้อมใช้งาน').length;

  document.getElementById('stat-issue').textContent=
    tableData.filter(r=>r.status==='ขาดเมล์+WiFi').length;

  document.getElementById('stat-repair').textContent=
    tableData.filter(r=>r.status==='ซ่อม').length;
}

async function loadFromGAS(){

  try{

    const res=await fetch(GAS_URL);
    const data=await res.json();

    tableData=data.map((r,index)=>({
      row:index+2,
      date:r["วันที่"]||"",
      name:r["ชื่อพนักงาน"]||"",
      machine:r["เบอร์เครื่อง"]||"",
      dept:r["แผนก"]||"",
      type:r["ประเภท"]||"",
      status:r["สถานะ"]||"",
      cabinet:r["ตู้ที่"]||"",
      operator:r["ผู้ดำเนินการ"]||""
    }));

    renderTable();

  }catch(err){

    console.log(err);

    document.getElementById('tableBody').innerHTML=`
      <tr>
        <td colspan="10">
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <p>โหลดข้อมูลไม่สำเร็จ</p>
          </div>
        </td>
      </tr>
    `;

    showToast('❌ โหลดข้อมูลไม่สำเร็จ','error');
  }
}

document.getElementById('addRowBtn').addEventListener('click',async()=>{

  const payload={
    action:'add',
    date:new Date().toLocaleDateString('th-TH'),

    employee:
      document.getElementById('f-id').value+
      ' / '+
      document.getElementById('f-name').value,

    machine:document.getElementById('f-machine').value,
    dept:document.getElementById('f-dept').value,
    type:document.getElementById('f-type').value,
    status:document.getElementById('f-status').value,
    cabinet:document.getElementById('f-cabinet').value,
    operator:document.getElementById('f-operator').value
  };

  try{

    await fetch(GAS_URL,{
      method:'POST',
      body:JSON.stringify(payload)
    });

    showToast('✅ เพิ่มข้อมูลสำเร็จ','success');

    document.getElementById('modalOverlay').classList.remove('active');

    loadFromGAS();

  }catch(err){

    console.log(err);
    showToast('❌ บันทึกไม่สำเร็จ','error');
  }

});

async function deleteRow(index){

  if(!confirm('ลบข้อมูลนี้ ?')) return;

  try{

    await fetch(GAS_URL,{
      method:'POST',
      body:JSON.stringify({
        action:'delete',
        row:tableData[index].row
      })
    });

    showToast('✅ ลบข้อมูลสำเร็จ');

    loadFromGAS();

  }catch(err){

    console.log(err);
    showToast('❌ ลบข้อมูลไม่สำเร็จ','error');
  }
}

document.getElementById('openModal').onclick=()=>{
  document.getElementById('modalOverlay').classList.add('active');
};

document.getElementById('closeModal').onclick=()=>{
  document.getElementById('modalOverlay').classList.remove('active');
};

document.getElementById('closeModal2').onclick=()=>{
  document.getElementById('modalOverlay').classList.remove('active');
};

loadFromGAS();
</script>
